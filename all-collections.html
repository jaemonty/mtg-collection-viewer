<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Collections — Arcane Archive</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/group.css"></head>
<body data-all-collections="true"><nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
<main class="browser-shell"><header class="page-hero compact-hero"><div><p class="eyebrow">ARCANE ARCHIVE</p><h1>All Collections</h1></div><p>Search every uploaded library, see who owns each card, and open any card for its full details.</p></header>
<section id="library-stats" class="compact-stats" aria-label="Collection statistics"></section>
<section class="search-bar"><label class="sr-only" for="search">Search all collections</label><input id="search" type="search" placeholder="Search all collections"><button id="clear-all" type="button">Reset</button></section>
<div id="load-errors" class="load-errors" role="status"></div><section class="browser-controls"><button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button><span id="result-count"></span><select id="grouping" aria-label="Card grouping"><option value="identical">Combine identical copies</option><option value="name">Group by Oracle card name</option><option value="printing">Show every owner copy</option></select><div><button id="view-grid" type="button">Grid</button><button id="view-list" type="button">List</button></div></section>
<section id="active-filters" class="active-filters" aria-label="Active filters"></section>
<div class="browser-layout"><aside id="filters" class="filter-panel" aria-label="Filters"><div id="owner-filter-group"><h2>Owners</h2><div id="owner-filters"></div></div>
<label>Colour<select id="color-filter"><option value="">All colours</option><option value="W">White</option><option value="U">Blue</option><option value="B">Black</option><option value="R">Red</option><option value="G">Green</option><option value="C">Colourless</option><option value="M">Multicolour</option></select></label>
<label>Card type<select id="type-filter"><option value="">All types</option><option>Creature</option><option>Instant</option><option>Sorcery</option><option>Artifact</option><option>Enchantment</option><option>Planeswalker</option><option>Land</option><option>Battle</option><option>Kindred</option></select></label>
<label>Creature type<input id="creature-type-filter" type="search" placeholder="e.g. Vampire or Hero"></label>
<label>Rarity<select id="rarity-filter"><option value="">All rarities</option><option value="common">Common</option><option value="uncommon">Uncommon</option><option value="rare">Rare</option><option value="mythic">Mythic</option><option value="special">Special</option><option value="bonus">Bonus</option></select></label>
<label>Finish<select id="finish-filter"><option value="">All finishes</option><option value="normal">Normal</option><option value="foil">Foil</option><option value="etched">Etched</option></select></label><label>Condition<select id="condition-filter"><option value="">All conditions</option></select></label><label>Binder<select id="binder-filter"><option value="">All binders</option></select></label><label>Set<select id="set-filter"><option value="">All sets</option></select></label><label>Minimum quantity<input id="quantity-filter" type="number" min="1" value="1"></label><label id="owner-count-wrap">Owner count<select id="owner-count-filter"><option value="">Any</option><option value="2">2+ people</option><option value="3">3+ people</option><option value="7">Everyone</option></select></label><label><input id="duplicates-filter" type="checkbox"> Group duplicates only</label><label><input id="legendary-filter" type="checkbox"> Legendary</label><label><input id="commander-filter" type="checkbox"> Can be a commander</label><label>Tokens<select id="token-filter"><option value="">All cards</option><option value="tokens">Tokens only</option><option value="nontokens">Non-token cards</option></select></label><label><input id="trade-filter" type="checkbox"> Likely trade binder only</label></aside>
<section><label>Sort <select id="sort"><option value="name">Card name A–Z</option><option value="name-desc">Card name Z–A</option><option value="newest">Newest added</option><option value="oldest">Oldest added</option><option value="quantity-desc">Highest quantity</option><option value="quantity-asc">Lowest quantity</option><option value="market-desc">Highest market value</option><option value="market-asc">Lowest market value</option><option value="set">Set</option><option value="rarity">Rarity</option><option value="owners-desc">Most owners</option><option value="group-quantity">Highest group quantity</option></select></label><div id="results" class="results grid"></div><button id="load-more" class="load-more-btn" type="button">Load more</button></section></div>
</main><div id="live-region" class="sr-only" aria-live="polite"></div><script src="js/collection-core.js"></script><script src="js/group-app.js"></script></body></html>
